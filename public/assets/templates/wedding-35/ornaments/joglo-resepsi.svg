<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldJoglo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#936F2B"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#goldJoglo)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stepped base -->
    <line x1="14" y1="90" x2="86" y2="90" stroke-width="2.8"/>
    <line x1="20" y1="84" x2="80" y2="84"/>
    
    <!-- Pillars / Soko Guru & perimeter columns -->
    <line x1="26" y1="84" x2="26" y2="62"/>
    <line x1="38" y1="84" x2="38" y2="62"/>
    <line x1="62" y1="84" x2="62" y2="62"/>
    <line x1="74" y1="84" x2="74" y2="62"/>
    
    <!-- Beam -->
    <line x1="22" y1="62" x2="78" y2="62"/>
    
    <!-- Joglo Tiered Roof -->
    <!-- Lower sweeping eave (atap tritisan) -->
    <path d="M12 62 C 24 58, 32 54, 40 44 L 60 44 C 68 54, 76 58, 88 62 Z"/>
    
    <!-- Middle slope / Brunjung -->
    <path d="M36 44 L 43 24 L 57 24 L 64 44 Z"/>
    
    <!-- Upper Ridge (Molo / Mustaka peak) -->
    <path d="M41 24 L 50 14 L 59 24 Z"/>
    <line x1="47" y1="14" x2="53" y2="14"/>
    <circle cx="50" cy="10" r="2.5" fill="url(#goldJoglo)"/>
    
    <!-- Eave accents -->
    <circle cx="12" cy="62" r="1.5" fill="url(#goldJoglo)"/>
    <circle cx="88" cy="62" r="1.5" fill="url(#goldJoglo)"/>
  </g>
</svg>