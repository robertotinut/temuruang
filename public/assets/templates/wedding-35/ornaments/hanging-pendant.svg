<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 120" width="60" height="120">
  <defs>
    <linearGradient id="goldPend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#936F2B"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#goldPend)" stroke-width="2" stroke-linecap="round">
    <!-- Hanging cord -->
    <line x1="30" y1="0" x2="30" y2="40"/>
    <!-- Top bead -->
    <circle cx="30" cy="44" r="4" fill="url(#goldPend)"/>
    <!-- Lantern diamond -->
    <polygon points="30,52 46,68 30,84 14,68" stroke-width="2" fill="none"/>
    <circle cx="30" cy="68" r="3" fill="url(#goldPend)"/>
    <!-- Bottom tassel cap -->
    <circle cx="30" cy="90" r="3" fill="url(#goldPend)"/>
    <!-- Tassel strands -->
    <line x1="30" y1="93" x2="30" y2="116"/>
    <line x1="26" y1="93" x2="24" y2="114"/>
    <line x1="34" y1="93" x2="36" y2="114"/>
  </g>
</svg>