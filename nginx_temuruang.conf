# Main server block - temuruang.web.id (primary domain)
server {
    server_name temuruang.web.id www.temuruang.web.id;
    root /var/www/temuruang/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/temuruang.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temuruang.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Redirect temuruang.com HTTPS -> temuruang.web.id
server {
    listen 443 ssl;
    server_name temuruang.com www.temuruang.com;
    ssl_certificate /etc/letsencrypt/live/temuruang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/temuruang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://temuruang.web.id$request_uri;
}

# Redirect all HTTP -> HTTPS temuruang.web.id
server {
    listen 80;
    server_name temuruang.com www.temuruang.com temuruang.web.id www.temuruang.web.id;
    return 301 https://temuruang.web.id$request_uri;
}
